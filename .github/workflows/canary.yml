name: Kick canary
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm i
        working-directory: canary
      - id: run
        run: node canary/canary.js | tee canary-report.txt
        continue-on-error: true
      - name: Open issue on failure
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(grep '^FAIL' canary-report.txt | head -5 | tr '\n' ' ')
          gh issue create --title "Kick canary failed: ${failed:-see run}" \
            --body "$(cat canary-report.txt)"$'\n\n'"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - if: steps.run.outcome == 'failure'
        run: exit 1
